<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Library chooser</title><style>__LIBRARY_CSS__</style></head><body><main>
<button id="return-to-chat" class="back" hidden>Return to chat</button><header><h1 id="title">Library</h1><span id="count" class="sr-only" aria-live="polite"></span><div class="header-actions"><button id="create" hidden>Create template</button><button id="previous" class="arrow" aria-label="Previous items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button id="next" class="arrow" aria-label="Next items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></header>
<section id="chooser" aria-label="Choose an item"><div class="toolbar"><label class="search-label"><span class="sr-only">Search library</span><input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search library"></label><details id="filters"><summary>Filters</summary><div id="filter-fields" class="filter-fields"></div></details><label class="sort-label"><span class="sr-only">Sort library</span><select id="sort" aria-label="Sort library"><option value="default">Sort: Default</option><option value="az">Sort: A–Z</option><option value="za">Sort: Z–A</option></select></label></div><div class="carousel"><div id="cards" class="cards" aria-label="Library previews" tabindex="0"><p>Loading options…</p></div></div><p id="empty" hidden>No matches. Try another search or clear your filters.</p><button id="reset" hidden>Clear search and filters</button></section>
<section id="detail-view" hidden><button id="detail-back" class="back">← Back to choices</button><div class="detail-heading"><div><h2 id="detail-title"></h2><p id="detail-type"></p></div><div class="actions"><button id="detail-use" class="primary">Use</button></div></div><div id="detail-content"></div></section>
<section id="handoff-view" hidden><button id="handoff-back" class="back">← Back to choices</button><h2 id="handoff-title"></h2><div id="prompt-panel" hidden><label class="field">Prompt for your conversation<textarea id="prompt" rows="10" readonly></textarea></label></div><label class="field">Additional instructions (optional)<textarea id="brief" rows="2" placeholder="Add your topic, audience, goals or changes to the selected prompt."></textarea></label><div class="actions"><button id="use" class="primary">Send to conversation</button><button id="copy">Copy prompt</button></div><p id="status" role="status" aria-live="polite"></p></section><p id="app-error" role="alert" hidden></p>
</main><script id="library-data" type="application/json">__LIBRARY_DATA__</script><script>__LIBRARY_BRIDGE__</script><script>__LIBRARY_JS__</script></body></html>
