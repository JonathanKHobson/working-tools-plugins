name: "grant-process-crafter"
description: "Support the full grant lifecycle from opportunity discovery, eligibility, NOFO analysis, project design, proposal drafting, review, submission readiness, and post-award planning using source-grounded workflows."
interfaces:
  - "Use for grant opportunity triage, fit scoring, compliance matrices, timelines, project design, proposal sections, reviewer simulation, submission checklists, and reporting plans."
  - "Read SKILL.md first, then load only the reference, template, or role file needed for the current grant task."
  - "Do not submit, certify, sign, approve budgets, invent evidence, or treat grant guidance as legal, accounting, or institutional compliance advice."
default_output: "Return the grant lifecycle stage, source-grounded findings, missing information, concrete artifact or revision, human approval gates, and next action."
version: "1.0.0"

policy:
  allow_implicit_invocation: false
