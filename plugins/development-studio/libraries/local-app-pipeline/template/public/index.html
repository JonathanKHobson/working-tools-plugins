<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Local App Template</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7f3ea 0%, #d6e7f5 100%);
        color: #18222d;
      }

      main {
        max-width: 720px;
        margin: 24px;
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 24px 80px rgba(24, 34, 45, 0.12);
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      code {
        padding: 0.15rem 0.4rem;
        border-radius: 6px;
        background: rgba(24, 34, 45, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local app preview is working</h1>
      <p>This is the fallback page served by <code>./scripts/start-dev.sh</code>.</p>
      <p>Replace it with your real app and keep the preview listening on port <code>3000</code>.</p>
      <p>PocketBase should be available on <code>http://127.0.0.1:8090</code>.</p>
    </main>
  </body>
</html>
