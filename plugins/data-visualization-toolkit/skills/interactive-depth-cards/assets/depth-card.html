<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src __SCRIPT_HASH__; base-uri 'none'; form-action 'none'">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:#edf0f2;color:#152b36;font:16px/1.5 system-ui,sans-serif;padding:clamp(16px,4vw,48px)}main{max-width:860px;margin:auto;background:#fff;border:1px solid #ccd7de;border-radius:20px;box-shadow:0 12px 38px #1232}.stage{padding:clamp(28px,9vw,86px);background:#dce6eb;display:grid;place-items:center;min-height:400px;border-radius:20px 20px 0 0;perspective:1100px;overflow:visible}.hit{width:min(100%,360px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;outline-offset:12px;touch-action:pan-y;cursor:grab;user-select:none}.hit:focus-visible{outline:3px solid #126293}.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(calc(var(--lift,0) * -9px));will-change:transform}.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s ease}.flipped .flipper{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d}.front{background:#173e52;border:8px solid var(--rim,#b7dce2);box-shadow:0 14px 30px #102b3c55}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#153544,#3d6572);border:8px double var(--rim,#b7dce2);color:#fff;display:grid;place-items:center;text-align:center;padding:28px}.back-copy{max-width:32ch;transform:translateZ(8px)}.back-copy strong{font-size:clamp(24px,5vw,36px)}.back-copy p{white-space:pre-line;overflow-wrap:anywhere}.art{position:absolute;inset:0;transform-style:preserve-3d}.depth-layer{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translate3d(calc(var(--px,0) * var(--shift)),calc(var(--py,0) * var(--shift)),var(--z));transition:transform .12s ease-out}.role-background{object-fit:cover;width:112%;height:112%;left:-6%;top:-6%;clip-path:inset(5.35% round 8px)}.role-foreground{object-fit:contain}.role-particles{object-fit:contain}.sparkles{position:absolute;inset:0;pointer-events:none;transform:translate3d(calc(var(--px,0) * 3px),calc(var(--py,0) * 3px),22px);backface-visibility:hidden}.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6d8;box-shadow:0 0 7px #fff7bd;animation:twinkle 3.8s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.35}to{opacity:1}}.print{position:absolute;inset:auto 10px 10px;z-index:2;transform:translate3d(calc(var(--px,0) * 4px),calc(var(--py,0) * 4px),58px);color:#fff;font-weight:700;text-shadow:0 2px 5px #102b3c;pointer-events:none;backface-visibility:hidden}.print span{display:block;width:fit-content;margin-top:3px;background:#102b3cbb;padding:3px 8px;border-radius:4px;max-width:100%;overflow-wrap:anywhere}.foil,.glare{position:absolute;inset:3px;border-radius:8px;pointer-events:none;transform:translateZ(63px);backface-visibility:hidden;opacity:0}.foil{background:repeating-linear-gradient(115deg,#efa9d0,#f7e5a3 18%,#a9e8d7 35%,#b9c9f5 52%);background-size:220% 220%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:screen;mask-image:radial-gradient(ellipse at var(--mx,50%) var(--my,50%),#000,transparent 82%)}.glare{background:radial-gradient(ellipse at var(--mx,50%) var(--my,50%),#fff9,transparent 65%);mix-blend-mode:screen}.has-foil .foil{opacity:.17}.has-foil .glare{opacity:calc(.08 + var(--lift,0) * .35)}.finish-gold{--rim:#e3c279}.finish-gold .foil{background:repeating-linear-gradient(115deg,#b67e2e,#ffe1a4 24%,#f7cc69 46%)}.finish-gold .role-background{filter:sepia(.2) saturate(1.2)}.finish-silver{--rim:#c8d6e4}.finish-silver .foil{background:repeating-linear-gradient(115deg,#9db2d2,#fff 24%,#c6d8e7 46%)}.finish-silver .role-background{filter:saturate(.65)}.exploded .role-background{transform:translate3d(-16%,2%,8px) rotateY(-8deg)}.exploded .role-particles{transform:translate3d(-7%,0,35px)}.exploded .role-foreground{transform:translate3d(0,-3%,88px) rotateY(-3deg)}.exploded .sparkles{transform:translate3d(-7%,0,35px)}.exploded .print{transform:translate3d(16%,-3%,145px)}.exploded .foil,.exploded .glare{opacity:0}.copy{padding:clamp(20px,5vw,36px)}h1{font-size:clamp(26px,5vw,36px);line-height:1.16;margin:5px 0 12px;overflow-wrap:anywhere}.subtitle{color:#405d6e;margin:0;font-weight:600}.body{margin:0;white-space:pre-line;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:20px 0}.fact{border-top:1px solid #ccd7de;padding-top:10px}.fact dt{font-size:14px;color:#405d6e}.fact dd{margin:4px 0}.source{display:block;color:#405d6e;font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}.controls button,.controls select,.controls input{font:inherit}.controls button,.controls select{border:1px solid #718c9c;background:#fff;border-radius:7px;color:#152b36;padding:7px 10px}.controls button{cursor:pointer}.controls label{display:flex;gap:6px;align-items:center}.controls input[type=range]{width:100px}.controls :focus-visible{outline:3px solid #126293;outline-offset:2px}.hint,.status{font-size:14px;color:#405d6e;margin:12px 0 0}.hit[aria-disabled=true]{cursor:default}@media(max-width:420px){.stage{padding:38px 26px;min-height:0}.hit{width:min(100%,240px)}.exploded .role-background{transform:translate3d(-7%,2%,8px) rotateY(-8deg)}.exploded .print{transform:translate3d(7%,-3%,145px)}.facts{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.tilt{will-change:auto}.flipper,.depth-layer{transition:none!important}.sparkles i{animation:none!important}}@media print{body{padding:0;background:#fff}main{border:0;box-shadow:none}.stage{min-height:0;padding:12px}.tilt,.flipper,.depth-layer,.print{transform:none!important}.controls,.hint,.status,.back,.foil,.glare,.sparkles{display:none!important}}
</style>
</head>
<body>
<main data-config="__CONFIG__" data-has-back="__HAS_BACK__">
<div class="stage"><div class="hit" tabindex="0" role="__CARD_ROLE__" aria-label="__TITLE__ card. Arrow keys tilt; Home resets__FLIP_HINT__." aria-describedby="hint"><div class="tilt"><div class="flipper"><div class="face front" aria-hidden="false"><div class="art">__LAYERS__</div>__SPARKLES__<div class="print"><span>__TITLE__</span>__CARD_TEXT__</div><div class="foil" aria-hidden="true"></div><div class="glare" aria-hidden="true"></div></div><div class="face back" aria-hidden="true">__BACK__</div></div></div></div></div>
<div class="copy"><p class="subtitle">__SUBTITLE__</p><h1>__TITLE__</h1><p class="body">__BODY__</p>__FACTS__
<div class="controls" hidden><label>Depth <input id="depth" type="range" min="0" max="100" step="1"><output id="depth-value"></output></label><label>Finish <select id="finish"><option value="holographic">Holographic</option><option value="gold">Gold</option><option value="silver">Silver</option></select></label><label><input id="foil" type="checkbox">Foil</label><label><input id="orbit" type="checkbox">Auto rotate</label><button id="explode" type="button" aria-pressed="false">Separate layers</button>__FLIP_CONTROL__<button id="reset" type="button">Reset view</button></div>
<p class="hint" id="hint">Static layered artwork. The title and description are available here.</p><p class="status" id="status" aria-live="polite"></p></div>
</main>
<script>
(()=>{'use strict';
const root=document.querySelector('main'),hit=root.querySelector('.hit'),tilt=root.querySelector('.tilt'),front=root.querySelector('.front'),back=root.querySelector('.back'),controls=root.querySelector('.controls'),depthInput=root.querySelector('#depth'),depthValue=root.querySelector('#depth-value'),finishInput=root.querySelector('#finish'),foilInput=root.querySelector('#foil'),orbitInput=root.querySelector('#orbit'),explodeButton=root.querySelector('#explode'),flipButton=root.querySelector('#flip'),resetButton=root.querySelector('#reset'),status=root.querySelector('#status');
const config=JSON.parse(root.dataset.config),hasBack=root.dataset.hasBack==='true',media=matchMedia('(prefers-reduced-motion: reduce)');
let depth=config.depth,finish=config.finish,foil=config.foil,orbit=config.autoRotate,exploded=config.exploded,flipped=false,down=null,dragged=false,touchId=null,frame=0,last=0,origin=performance.now(),current={x:0,y:0,lift:0},target={x:0,y:0,lift:0},hovered=false,keys=false,disposed=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const strength=()=>media.matches||flipped||exploded?0:depth/100;
function paint(){const s=strength(),x=current.x*s,y=current.y*s;tilt.style.setProperty('--rx',(-y*14).toFixed(3)+'deg');tilt.style.setProperty('--ry',(x*14).toFixed(3)+'deg');tilt.style.setProperty('--px',x.toFixed(4));tilt.style.setProperty('--py',y.toFixed(4));tilt.style.setProperty('--mx',(50+x*50).toFixed(2)+'%');tilt.style.setProperty('--my',(50+y*50).toFixed(2)+'%');tilt.style.setProperty('--lift',(current.lift*s).toFixed(4));}
function stop(){if(frame)cancelAnimationFrame(frame);frame=0;last=0;}
function schedule(){if(!frame&&!disposed&&!document.hidden&&strength())frame=requestAnimationFrame(tick);}
function tick(now){frame=0;if(!strength()){neutral();return;}const ambient=orbit&&!hovered&&!keys;if(ambient){const t=now-origin;target={x:Math.sin(t/4200)*.42,y:Math.sin(t/5700)*.3,lift:.55};}const delta=last?clamp(now-last,0,64):16.7,alpha=1-Math.exp(-delta/85);last=now;let moving=false;for(const k of ['x','y','lift']){current[k]+=(target[k]-current[k])*alpha;if(Math.abs(target[k]-current[k])<.0005)current[k]=target[k];else moving=true;}paint();if(ambient||moving)schedule();else last=0;}
function neutral(){stop();hovered=false;keys=false;current={x:0,y:0,lift:0};target={x:0,y:0,lift:0};paint();if(orbit&&strength())schedule();}
function position(e){const b=hit.getBoundingClientRect();if(!b.width||!b.height)return;target={x:clamp((e.clientX-b.left)/b.width*2-1,-1,1),y:clamp((e.clientY-b.top)/b.height*2-1,-1,1),lift:1};hovered=true;keys=false;schedule();}
function sync(){hit.classList.toggle('flipped',flipped);hit.classList.toggle('exploded',exploded);hit.classList.toggle('has-foil',foil);hit.classList.remove('finish-holographic','finish-gold','finish-silver');hit.classList.add('finish-'+finish);front.setAttribute('aria-hidden',String(flipped));back.setAttribute('aria-hidden',String(!flipped));if(hasBack)hit.setAttribute('aria-pressed',String(flipped));depthInput.value=String(depth);depthValue.value=String(depth);finishInput.value=finish;foilInput.checked=foil;orbitInput.checked=orbit;explodeButton.setAttribute('aria-pressed',String(exploded));explodeButton.textContent=exploded?'Join layers':'Separate layers';if(flipButton){flipButton.setAttribute('aria-pressed',String(flipped));flipButton.textContent=flipped?'Show front':'Show back';}status.textContent=media.matches?'Reduced motion is active; views change immediately.':depth===0?'Depth is zero; input motion and light are neutral.':exploded?'Layers are separated.':flipped?'Back face shown.':'Interactive depth is ready.';neutral();}
function flip(){if(!hasBack)return;flipped=!flipped;if(flipped)exploded=false;sync();}
function releaseTouch(){if(touchId!==null){try{if(hit.hasPointerCapture(touchId))hit.releasePointerCapture(touchId)}catch{}touchId=null;}}
hit.addEventListener('pointerdown',e=>{if(e.isPrimary===false)return;down={x:e.clientX,y:e.clientY,id:e.pointerId};dragged=false;if(e.pointerType==='touch'){touchId=e.pointerId;try{hit.setPointerCapture(touchId)}catch{}}if(strength())position(e);});
hit.addEventListener('pointermove',e=>{if(down&&down.id===e.pointerId&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)dragged=true;if(e.pointerType==='touch'&&e.pointerId!==touchId)return;if(strength())position(e);});
hit.addEventListener('pointerup',e=>{if(touchId===e.pointerId){releaseTouch();neutral();}down=null;});
hit.addEventListener('pointercancel',()=>{down=null;dragged=true;releaseTouch();neutral();});hit.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')neutral();});hit.addEventListener('blur',neutral);
hit.addEventListener('click',e=>{if(!hasBack)return;if(e.detail===0||!dragged)flip();dragged=false;});
hit.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&hasBack){e.preventDefault();flip();return;}if(['Escape','Home','0'].includes(e.key)){e.preventDefault();neutral();return;}const steps={ArrowLeft:[-.2,0],ArrowRight:[.2,0],ArrowUp:[0,-.2],ArrowDown:[0,.2]};if(steps[e.key]&&strength()){e.preventDefault();keys=true;hovered=false;target={x:clamp(target.x+steps[e.key][0],-1,1),y:clamp(target.y+steps[e.key][1],-1,1),lift:1};schedule();}});
depthInput.addEventListener('input',()=>{depth=Number(depthInput.value);sync();});finishInput.addEventListener('change',()=>{finish=finishInput.value;sync();});foilInput.addEventListener('change',()=>{foil=foilInput.checked;sync();});orbitInput.addEventListener('change',()=>{orbit=orbitInput.checked;sync();});explodeButton.addEventListener('click',()=>{exploded=!exploded;if(exploded)flipped=false;sync();});if(flipButton)flipButton.addEventListener('click',flip);resetButton.addEventListener('click',()=>{neutral();status.textContent='View reset.';});media.addEventListener('change',sync);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else neutral();});window.addEventListener('pagehide',()=>{disposed=true;stop();releaseTouch()});window.addEventListener('pageshow',()=>{disposed=false;neutral();});controls.hidden=false;sync();
})();
</script>
</body>
