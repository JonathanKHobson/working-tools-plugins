<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinking Orbs · Canvas gallery</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#fff;color:#142536;font:17px system-ui,sans-serif}main{max-width:960px;margin:auto}h1{font-size:2rem}p{max-width:65ch;line-height:1.5}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:10px;border:1px solid currentColor;background:inherit;color:inherit;border-radius:6px}button:focus-visible,select:focus-visible{outline:3px solid #917000;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:30px}.orb{min-height:170px;border:1px solid #abb8be;border-radius:12px;padding:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-around;gap:14px}.orb span{flex-basis:100%;text-align:center;text-transform:capitalize}body.dark{background:#142536;color:#fff}@media(max-width:560px){body{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.orb{padding:12px;gap:8px}}@media(prefers-reduced-motion:reduce){button{scroll-behavior:auto}}
</style><main><h1>Thinking Orbs</h1><p>Nine state illustrations at the two tuned sizes. Animation starts paused. Labels describe this gallery; a real app must show its actual status.</p><nav><button id="motion">Play animation</button><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></nav><p id="status" role="status">Paused. Reduced motion is respected.</p><section class="grid" aria-label="Orb states"></section></main><script type="module">
import{ORB_STATES,mountOrb}from'./orb-canvas.mjs';let mounts=[],paused=true;const grid=document.querySelector('.grid'),theme=document.querySelector('#theme'),button=document.querySelector('#motion'),status=document.querySelector('#status');for(const state of ORB_STATES){const box=document.createElement('div');box.className='orb';for(const size of[64,20]){const c=document.createElement('canvas');c.dataset.state=state;c.dataset.size=size;box.append(c)}const label=document.createElement('span');label.textContent=state;box.append(label);grid.append(box)}function mount(){mounts.forEach(m=>m.dispose());const dark=theme.value==='dark';document.body.classList.toggle('dark',dark);mounts=[...grid.querySelectorAll('canvas')].map(c=>mountOrb(c,{state:c.dataset.state,size:Number(c.dataset.size),dark,paused,label:c.dataset.state+' illustration'}));button.textContent=paused?'Play animation':'Pause animation';status.textContent=paused?'Paused. Reduced motion is respected.':matchMedia('(prefers-reduced-motion:reduce)').matches?'Reduced motion is active: illustrations remain static.':'Playing. Offscreen and hidden illustrations pause.'}button.addEventListener('click',()=>{paused=!paused;mount()});theme.addEventListener('change',mount);addEventListener('pagehide',()=>mounts.forEach(m=>m.dispose()));mount();window.galleryReady=true;
</script></html>
