name: Validate packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/packages.py validate
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s plugins/artcraft-design-toolkit/tests -v
      - name: Enforce reviewed source coverage and verify release archives
        run: python scripts/packages.py release
